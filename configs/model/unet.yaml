_target_: image_fidelity.restoration.nn.models.UNet

in_channels: 1
out_channels: 1
# depth=3 downsamplings: 32 -> 64 -> 128 (encoder), 256 (bottleneck)
base_channels: 32
depth: 3

activation: relu
normalization: batch
# true: the network predicts the degradation and outputs x - net(x)
residual: false
