# @package _global_

defaults:
  - override /task: train_restore
  - override /data: bbbc038
  - override /model: restoration_unet
  - override /optimizer: adamw
  - override /trainer: gpu
  - override /metrics: restoration
  - override /degradation: gaussian_noise

seed: 42

optimizer:
  lr: 0.0001

trainer:
  epochs: 100
  batch_size: 16

noise:
  mode: variable
  min: 0.1
  max: 1

model:
  residual: True

degradation:
  sigma: 0.10

run_name: unet_bbbc038
