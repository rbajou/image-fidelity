[project]
name = "image-fidelity"
version = "0.1.0"
description = "Image restoration fidelity benchmark pipeline (dataset -> degradation -> restoration -> evaluation)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "hydra-core>=1.3",
    "numpy>=1.26",
    "pillow>=10.0",
    "scipy>=1.11",
    "scikit-image>=0.22",
]

[project.optional-dependencies]
tiff = ["tifffile>=2024.1.1"]
volumes = ["zarr>=2.17", "h5py>=3.10"]
dev = ["pytest>=8.0"]
visualization = ["matplotlib>=3.8"]
learning = ["torch>=2.2"]
benchmark = ["pandas>=2.1", "pyarrow>=14"]

[project.scripts]
imfid = "image_fidelity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["image_fidelity*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
